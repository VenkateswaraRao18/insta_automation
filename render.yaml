# Optional: connect this repo in Render → New Blueprint Instance, or create a Web Service manually with the same commands.
# Set secrets (API keys, tokens) in the Render dashboard — do not commit them here.

services:
  - type: web
    name: insta-automation-api
    env: node
    plan: free
    envVars:
      # Keep Playwright browser binaries inside the service build artifact.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
    # --with-deps uses su/apt and fails on Render; browser binaries only is enough on their image.
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: npm run api:start
    healthCheckPath: /api/health
